name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # Find the latest Xcode 26 beta installed on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26 found. Available Xcodes:"
            ls /Applications/ | grep -i xcode
            exit 1
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Generate Config.xcconfig
        run: |
          cat > Config.xcconfig << 'EOF'
          TENOR_API_KEY = placeholder
          TENOR_CLIENT_KEY = placeholder
          KLIPY_API_KEY = placeholder
          IMGUR_CLIENT_ID = placeholder
          NOSTRCHECK_PUBLIC_API_KEY = placeholder
          NOSTUR_IS_DESKTOP = NO
          NIP89_APP_NAME = Nostur
          NIP89_APP_REFERENCE =
          APPSTORE_VERSION = 0.0.1
          EOF

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme Nostur \
            -clonedSourcePackagesDirPath .spm-cache

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -scheme Nostur \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5' \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO
